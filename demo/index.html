<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>RAG Slogans</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 1.5rem;
				background: #f6f6f7;
				color: #1b1b1f;
			}

			header h1 {
				margin: 0 0 0.25rem;
				font-size: 1.4rem;
			}

			header p {
				margin: 0 0 1rem;
				color: #5b5b66;
			}

			main {
				display: grid;
				grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
				gap: 1rem;
				max-width: 72rem;
				margin: 0 auto;
			}

			@media (max-width: 48rem) {
				main {
					grid-template-columns: 1fr;
				}
			}

			#chat,
			#results {
				background: #fff;
				border: 1px solid #dcdce2;
				border-radius: 0.75rem;
				padding: 1rem;
			}

			#messages {
				display: flex;
				flex-direction: column;
				gap: 0.6rem;
				min-height: 16rem;
				max-height: 32rem;
				overflow-y: auto;
				margin-bottom: 0.75rem;
			}

			.message {
				padding: 0.5rem 0.75rem;
				border-radius: 0.5rem;
				white-space: pre-wrap;
			}

			.message.user {
				align-self: flex-end;
				background: #2f6fed;
				color: #fff;
				max-width: 85%;
			}

			.message.assistant {
				background: #f0f0f3;
				max-width: 95%;
			}

			#composer {
				display: flex;
				gap: 0.5rem;
			}

			#input {
				flex: 1;
				padding: 0.5rem 0.75rem;
				border: 1px solid #c9c9d1;
				border-radius: 0.5rem;
				font: inherit;
			}

			button {
				padding: 0.5rem 0.9rem;
				border: 0;
				border-radius: 0.5rem;
				background: #2f6fed;
				color: #fff;
				font: inherit;
				cursor: pointer;
			}

			#results h2 {
				margin: 0 0 0.5rem;
				font-size: 1rem;
			}

			#toggle-row {
				display: flex;
				align-items: center;
				gap: 0.4rem;
				margin-bottom: 0.5rem;
				color: #5b5b66;
			}

			#hits {
				margin: 0;
				padding-left: 1.1rem;
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}

			#hits li {
				font-size: 0.95rem;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Recherche de slogans</h1>
			<p>Recherche hybride dense + BM25, answers by an LLM through tool calling.</p>
		</header>
		<main>
			<section id="chat">
				<div id="messages"></div>
				<form id="composer">
					<input
						id="input"
						autocomplete="off"
						placeholder="Posez une question, par exemple : slogans sur le sucre"
					/>
					<button type="submit">Envoyer</button>
				</form>
			</section>
			<aside id="results">
				<h2>Slogans trouvés</h2>
				<label id="toggle-row">
					<input type="checkbox" id="toggle" checked />
					Afficher les résultats de recherche
				</label>
				<ul id="hits"></ul>
			</aside>
		</main>
		<script>
			const messagesEl = document.getElementById("messages")
			const form = document.getElementById("composer")
			const input = document.getElementById("input")
			const hitsEl = document.getElementById("hits")
			const toggle = document.getElementById("toggle")
			const history = []

			/** Append one chat message and return its element. */
			const appendMessage = (role, text) => {
				const element = document.createElement("div")
				element.className = `message ${role}`
				element.textContent = text
				messagesEl.append(element)
				messagesEl.scrollTop = messagesEl.scrollHeight

				return element
			}

			/** Replace the retrieved-slogan list. */
			const renderHits = (hits) => {
				hitsEl.replaceChildren()

				for (const hit of hits) {
					const item = document.createElement("li")
					item.textContent = `${hit.marque} (${hit.annee}) — ${hit.slogan}`
					hitsEl.append(item)
				}
			}

			/** Load the slogans for one query into the side panel. */
			const loadHits = async (query) => {
				try {
					const response = await fetch(`/api/slogans?q=${encodeURIComponent(query)}&topK=5`)
					const data = await response.json()
					renderHits(data.results ?? [])
				} catch {
					renderHits([])
				}
			}

			form.addEventListener("submit", async (event) => {
				event.preventDefault()
				const text = input.value.trim()

				if (text === "") {
					return
				}

				input.value = ""
				appendMessage("user", text)
				history.push({ role: "user", parts: [{ type: "text", text }] })
				loadHits(text)
				const reply = appendMessage("assistant", "")
				let answer = ""

				try {
					const response = await fetch("/api/chat", {
						method: "POST",
						headers: { "content-type": "application/json" },
						body: JSON.stringify({ messages: history }),
					})

					if (!response.ok || response.body === null) {
						const detail = await response.json().catch(() => ({}))
						throw new Error(detail.error ?? `HTTP ${response.status}`)
					}

					const reader = response.body.getReader()
					const decoder = new TextDecoder()

					for (;;) {
						const { value, done } = await reader.read()

						if (done) {
							break
						}

						answer += decoder.decode(value, { stream: true })
						reply.textContent = answer
						messagesEl.scrollTop = messagesEl.scrollHeight
					}

					history.push({ role: "assistant", parts: [{ type: "text", text: answer }] })
				} catch (error) {
					reply.textContent = `Erreur : ${error instanceof Error ? error.message : String(error)}`
				}
			})

			toggle.addEventListener("change", () => {
				hitsEl.style.display = toggle.checked ? "" : "none"
			})
		</script>
	</body>
</html>
